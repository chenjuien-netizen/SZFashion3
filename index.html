<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SZFashion" />
    <meta name="theme-color" content="#f8fafc" />
    <title>SZFashion Stock Mobile</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: "#f3f4f6",
              surface: "#f8fafc",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#f8fafc",
              "surface-container": "#e5e7eb",
              "surface-container-high": "#d1d5db",
              "surface-container-highest": "#cbd5e1",
              "surface-tint": "#0f766e",
              primary: "#0f766e",
              "primary-dim": "#115e59",
              "primary-container": "#ccfbf1",
              "on-primary": "#f8fafc",
              "on-primary-container": "#134e4a",
              "on-surface": "#111827",
              "on-surface-variant": "#475569",
              outline: "#64748b",
              "outline-variant": "#cbd5e1",
              error: "#dc2626",
              "error-container": "#fee2e2",
              "on-error-container": "#7f1d1d",
              "on-background": "#0f172a"
            },
            boxShadow: {
              ledger: "0 1px 0 rgba(15, 23, 42, 0.06)"
            }
          }
        }
      };
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
    <style>
      html, body {
        font-family: Inter, sans-serif;
      }

      .inventory-scroll {
        -webkit-overflow-scrolling: touch;
      }
    </style>
    <link rel="stylesheet" href="./style.css" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js" defer></script>
    <script src="./local-data.js" defer></script>
    <script src="./remote-data.js" defer></script>
    <script src="./app.js" defer></script>
    <script src="./app-vue-history.js" defer></script>
    <script src="./app-vue-detail.js" defer></script>
    <script src="./app-vue-imports.js" defer></script>
    <script src="./app-vue-tickets.js" defer></script>
    <script src="./app-vue-quick-edit.js" defer></script>
    <script src="./app-vue.js" defer></script>
    <script src="./app-vue-root.js" defer></script>
  </head>
  <body class="h-[100dvh] max-h-[100dvh] overflow-hidden bg-background text-on-surface antialiased" data-page="app">
    <div class="h-full min-h-0" id="app"></div>
  </body>
</html>
